# PV lab knowledge library
# Fill [ai] before using parse/extract. Fill [neo4j] later for graph sync.

[storage]
backend = "local"
local_root = "data/minio"
catalog = "data/catalog.sqlite"
minio_endpoint = ""
minio_access_key = ""
minio_secret_key = ""
minio_bucket = "papers"
minio_secure = false

[ai]
# DeepSeek OpenAI-compatible API. Fill api_key, or set DEEPSEEK_API_KEY.
# This model is used for paper graph extraction (and other AI calls).
base_url = "https://api.deepseek.com"
api_key = ""
model = "deepseek-flash"
timeout_seconds = 180
reasoning_effort = "high"
thinking = true

[neo4j]
enabled = false
uri = "bolt://127.0.0.1:7687"
user = "neo4j"
password = ""
database = "neo4j"
